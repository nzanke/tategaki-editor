<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>読む｜縦書きエディタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap;unicode-range:U+0020-007E,U+00A0-00FF}
@font-face{font-family:"UD英数";src:url(lib/fonts/biz-udgothic-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0020-007E,U+00A0-00FF}
:root{--ui:"UD英数","BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif;--num:"UD英数","BIZ UDGothic",ui-monospace,monospace;--ink:#222;--sub:#6b7280;--line:#e2e5ea;--accent:#2f6fd6;--bg:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ui);background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:16px;margin:0;flex:1}
.bar h1 a{color:inherit;text-decoration:none}
.bar a.w{font-size:13px;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
#cats{max-width:760px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap}
#cats button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink)}
#cats button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#cats .n{font-family:var(--num);font-size:11px;opacity:.7;margin-left:4px}
main{max-width:760px;margin:0 auto;padding:16px}
.card{display:block;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit}
.card:hover{border-color:#b9c2cf}
.card h2{font-size:17px;margin:0 0 4px;line-height:1.5}
.meta{font-size:12px;color:var(--sub);font-family:var(--num)}
.tag{display:inline-block;font-family:var(--ui);font-size:11px;padding:1px 8px;border-radius:999px;background:#e8f0fc;color:var(--accent);margin-right:6px}
.card p{margin:8px 0 0;font-size:14px;color:#444;line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
article{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px 24px 32px}
article h2{font-size:22px;margin:6px 0 6px;line-height:1.5}
.body{margin-top:20px;font-size:16px;line-height:1.95;letter-spacing:.02em}
.body p{margin:0}
.body p.gap{height:1em}
.back{display:inline-block;margin-bottom:12px;font-size:14px;color:var(--accent);text-decoration:none}
.empty{color:var(--sub);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <div class="bar"><h1><a href="#">読む</a></h1><a class="w" href="./">書く</a></div>
  <div id="cats"></div>
</header>
<main id="main"><div class="empty">読み込み中…</div></main>
<script>
(() => {
const REPO = 'nzanke/tategaki-editor', PATH = 'data/articles.json';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 縦書き用に全角にした英数字を、横書きでは半角に戻す
const han = c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
const toHan = s => s.replace(/[０-９Ａ-Ｚａ-ｚ％＋＝＆＠＃]/g, han)
  .replace(/([0-9A-Za-z])([．，：－／])(?=[0-9A-Za-z])/g, (m, a, b) => a + han(b));
const fmt = iso => { if (!iso) return ''; const d = new Date(iso), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`; };
let ART = [], CATS = [];

async function load(){
  let d = null;
  try {   // 保存直後でも最新が見えるよう、まず GitHub から直接読む
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${PATH}?t=${Date.now()}`, {headers:{Accept:'application/vnd.github.raw+json'}, cache:'no-store'});
    if (r.ok) d = await r.json();
  } catch(e){}
  if (!d) { try { const r = await fetch(PATH + '?t=' + Date.now(), {cache:'no-store'}); if (r.ok) d = await r.json(); } catch(e){} }
  if (!d) { $('main').innerHTML = '<div class="empty">記事を読み込めませんでした</div>'; return; }
  ART = Object.values(d.articles || {}).filter(a => !a.deleted && ((a.body || '').trim() || (a.title || '').trim()))
    .sort((x, y) => (y.updated || '').localeCompare(x.updated || ''));
  const used = new Set(ART.map(a => a.category || ''));
  CATS = (d.categories || []).filter(c => used.has(c));
  for (const c of used) if (c && !CATS.includes(c)) CATS.push(c);
  if (used.has('')) CATS.push('');
  route();
}

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('a=')) return showArticle(h.slice(2));
  showList(h.startsWith('c=') ? h.slice(2) : null);
}
function renderCats(sel){
  const btn = (c, label, n) => `<button data-c="${c === null ? '' : 'c=' + esc(c)}" class="${sel === c ? 'on' : ''}">${esc(label)}<span class="n">${n}</span></button>`;
  $('cats').innerHTML = btn(null, 'すべて', ART.length) +
    CATS.map(c => btn(c, c || '未分類', ART.filter(a => (a.category || '') === c).length)).join('');
}
$('cats').addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = b.dataset.c; });

function showList(cat){
  if (cat !== null && !CATS.includes(cat)) cat = null;
  renderCats(cat);
  const items = cat === null ? ART : ART.filter(a => (a.category || '') === cat);
  $('main').innerHTML = items.length ? items.map(a => `
    <a class="card" href="#a=${encodeURIComponent(a.id)}">
      <h2>${esc(toHan(a.title || '無題'))}</h2>
      <div class="meta">${a.category ? `<span class="tag">${esc(a.category)}</span>` : ''}${fmt(a.updated)}</div>
      <p>${esc(toHan((a.body || '').replace(/\s+/g, ' ').trim()).slice(0, 140))}</p>
    </a>`).join('') : '<div class="empty">まだ記事がありません</div>';
  document.title = (cat === null ? '' : (cat || '未分類') + '｜') + '読む｜縦書きエディタ';
  window.scrollTo(0, 0);
}
function showArticle(id){
  const a = ART.find(x => x.id === id);
  if (!a) return showList(null);
  renderCats(a.category || '');
  const paras = toHan(a.body || '').split('\n').map(p => p.trim() === '' ? '<p class="gap"></p>' : `<p>${esc(p)}</p>`).join('');
  $('main').innerHTML = `<a class="back" href="#c=${esc(a.category || '')}">← ${esc(a.category || '未分類')}の一覧へ</a>
    <article><div class="meta">${a.category ? `<span class="tag">${esc(a.category)}</span>` : ''}${fmt(a.updated)}</div>
    <h2>${esc(toHan(a.title || '無題'))}</h2><div class="body">${paras}</div></article>`;
  document.title = (a.title || '無題') + '｜読む';
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
load();
})();
</script>
</body>
</html>
